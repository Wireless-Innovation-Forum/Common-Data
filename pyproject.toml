[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winnf"
version = "1.0.0"
description = "WInnForum common data libraries"
readme = "src/README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["src/LICENSE"]
authors = [
  { name = "WInnForum Authors" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "numpy>=1.26,<3",
  "pykml>=0.2",
  "sciencebasepy>=2.0.5",
  "shapely>=2.0,<3",
]

[project.optional-dependencies]
pop = [
  "GDAL>=3",
]
test = [
  "pygc>=2",
  "pytest>=8",
]
scripts = [
  "ftputil>=5.1",
  "matplotlib>=3.8",
  "pyshp>=2.3",
]

[dependency-groups]
dev = [
  "build>=1.2",
  "pygc>=2",
  "pytest>=8",
  "setuptools>=77",
  "wheel>=0.45",
]

[tool.setuptools]
package-dir = { "" = "src" }
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["winnf*"]
namespaces = false

[tool.uv]
package = true
